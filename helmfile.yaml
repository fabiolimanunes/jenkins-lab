repositories:
  - name: ingress-nginx
    url: https://kubernetes.github.io/ingress-nginx
  - name: jenkins
    url: https://charts.jenkins.io
  - name: gitea
    url: https://dl.gitea.com/charts/
  - name: harbor
    url: https://helm.goharbor.io
  - name: sonarqube
    url: https://SonarSource.github.io/helm-chart-sonarqube

releases:

  - name: ingress-nginx
    namespace: ingress-nginx
    createNamespace: true
    chart: ingress-nginx/ingress-nginx
    version: 4.11.3
    values:
      - values/ingress-nginx/values.yaml

  - name: jenkins
    namespace: jenkins
    createNamespace: true
    chart: jenkins/jenkins
    version: 5.8.36
    installed: true
    values:
      - values/jenkins/values.yaml
  
  - name: gitea
    namespace: gitea
    createNamespace: true
    chart: gitea/gitea
    version: 11.0.0
    #version: 10.6.0 ## ultimaversao deu erro no redis, desabilitei
    #version: 10.1.1
    values:
      - values/gitea/values.yaml

  - name: harbor
    namespace: harbor
    createNamespace: true
    chart: harbor/harbor
    installed: true
    version: 1.17.0
    values:
      - values/harbor/values.yaml
  
  - name: sonarqube
    namespace: sonarqube
    createNamespace: true
    chart: sonarqube/sonarqube
    version: 2025.2.0
    installed: true
    values:
      - values/sonarqube/values.yaml